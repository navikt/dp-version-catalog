version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:05"
      timezone: "Europe/Oslo"
  - package-ecosystem: "gradle"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "daily"
      time: "10:05"
      timezone: "Europe/Oslo"
    groups:
      build-tooling:
        patterns:
          - "com.diffplug.spotless*"
          - "com.gradleup.shadow*"
          - "gradle-wrapper"
