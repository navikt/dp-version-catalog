name: Publish to GitHub Package Repository

on:
  push:
    branches:
      - main
    paths:
      - 'gradle/libs.versions.toml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit
      - name: Verifiser versjonskatalog
        run: ./gradlew :catalog-verify:verifyVersionCatalogResolves
      - name: Build
        run: ./gradlew --configuration-cache generateCatalogAsToml
        env:
          # Eksluder test dependencies
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: compileClasspath|runtimeClasspath

      - name: Set release tag
        run: |
          # NB: Versjonen har bevisst KUN to rent numeriske segmenter (dato.byggnummer),
          # uten git-sha-suffiks. Dependabot sin Maven-versjonsparser tolker et
          # avsluttende ikke-numerisk segment (f.eks. "f73750") som en Maven-classifier,
          # og filtrerer da bort alle andre versjoner som ikke deler nøyaktig samme
          # classifier. Siden git-shaen er unik per commit, matchet ALDRI noen andre
          # versjoner, og Dependabot rapporterte permanent "no update possible" for
          # denne avhengigheten i alle konsument-repoer. GITHUB_RUN_NUMBER er allerede
          # unikt og monotont økende, så git-shaen tilfører ingen unikhet — kun
          # sporbarhet, som fortsatt bevares via selve git-taggen og release notes.
          export TAG_NAME="$(TZ="Europe/Oslo" date +%Y%m%d).$(echo $GITHUB_RUN_NUMBER)"
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # ratchet:ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          generateReleaseNotes: true
          makeLatest: true # Versjonnummerene er ikke semantiske

      - name: publish
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_version: ${{ env.RELEASE_TAG }}
          ORG_GRADLE_PROJECT_githubUser: x-access-token
          ORG_GRADLE_PROJECT_githubPassword: ${{ secrets.GITHUB_TOKEN }}
