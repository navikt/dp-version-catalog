name: Test

on:
  pull_request:
    paths:
      - 'gradle/libs.versions.toml'

jobs:
  test:
    name: Verifiser at alle dependencies resolver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Verifiser versjonskatalog
        run: ./gradlew :catalog-verify:verifyVersionCatalogResolves
